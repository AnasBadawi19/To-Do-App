<!DOCTYPE html>
<html>
    <head>
        <title>
            MY WORKPLACE
        </title>
        <link rel="stylesheet" href="style.css">
            <link rel="icon" href="images/favicon.jpg">

    </head>

    <body id="wbody">
     <h1 id="wh1"> Welcome To Your Workplace </h1>

     <div id="pomodoro">
        <h2 id="pomo-title">Pomodoro Timer</h2>
        <p id="pomo-mode">Work</p>
        <div id="pomo-display">25:00</div>
        <div id="pomo-controls">
            <button id="pomo-toggle">Start</button>
            <button id="pomo-reset">Reset</button>
        </div>
        <div id="pomo-settings">
            <label>Work (min) <input type="number" id="pomo-work" value="25" min="1" max="180"></label>
            <label>Break (min) <input type="number" id="pomo-break" value="5" min="1" max="60"></label>
        </div>
     </div>

     <div id="wchecklist">
                 <p id="wp1"> What Are Your Tasks For Today?</p>

    <input type="checkbox" id="task1"> <input type="text" class="task-input" placeholder="enter your task..."><br>
     <button id="task-btn">+ Add Task</button>
    </div>
    
    <div id="wtable">
        <button id="add-row-btn">+ Add Row</button>
     <p id="wp2">Divide Your Day According to Your Tasks</p>
    <table>
     <tr>
        <th id="task">Task</th>
        <th id="time">Time</th>
     
    </tr>
    <tr>
        <td><input type="text" placeholder="enter your task..."></td>
        <td><input type="text" placeholder="enter time..."></td>
    </tr>
    
    
    </table>
    </div>

    <div id="weekly-planner">
        <h2 id="wp3">Your Weekly Planner</h2>
        <div id="week-grid"></div>
    </div>

    <script src="script.js"></script>
  
    </body>
</html>
